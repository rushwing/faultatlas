global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: faultatlas-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: faultatlas-retriever
    static_configs:
      - targets: ["retriever:8001"]
    metrics_path: /metrics
