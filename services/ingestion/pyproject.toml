[project]
name = "faultatlas-ingestion"
version = "0.1.0"
description = "FaultAtlas document ingestion pipeline worker"
requires-python = ">=3.12"
dependencies = [
    "faultatlas-shared",
    "openai>=1.30",
    "langchain-text-splitters>=0.2",
    "pypdf>=4.0",
    "python-json-logger>=2.0",
]

[tool.uv.sources]
faultatlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
