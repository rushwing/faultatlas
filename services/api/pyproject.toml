[project]
name = "faultatlas-api"
version = "0.1.0"
description = "FaultAtlas API gateway and agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    "faultatlas-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # file uploads
    "openai>=1.30",
    "httpx>=0.27",
]

[tool.uv.sources]
faultatlas-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
