[tool.uv.workspace]
members = [
    "shared",
    "services/api",
    "services/ingestion",
    "services/retriever",
    "harness",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests", "services/api/tests", "services/ingestion/tests", "services/retriever/tests"]
markers = [
    "integration: requires live backing services",
    "requires_gpu: requires a GPU-backed model server",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
