[project]
name = "faultatlas-shared"
version = "0.1.0"
description = "Shared models, events, and clients for FaultAtlas services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.4",          # async MongoDB
    "redis[hiredis]>=5.0",
    "confluent-kafka>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultatlas"]
