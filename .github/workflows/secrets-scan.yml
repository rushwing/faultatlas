name: Secrets Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    name: Detect Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fast pattern-based scan (no external service, runs in < 5s)
      - name: Scan for credential patterns
        run: bash scripts/ci/scan-secrets.sh

      # Gitleaks for comprehensive git history scan (on PRs only)
      - name: Gitleaks scan
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # free for public repos
