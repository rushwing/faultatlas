# NOTE: For production, prefer MongoDB Atlas or a managed service.
# This StatefulSet is for staging/demo environments only.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: faultatlas
spec:
  serviceName: mongo-svc
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: faultatlas
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
