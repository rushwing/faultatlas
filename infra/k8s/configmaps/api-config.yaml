apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: faultatlas
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MONGO_DB: "faultatlas"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "faultatlas-group"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
  OPENAI_CHAT_MODEL: "gpt-4o-mini"
  RETRIEVER_URL: "http://retriever-svc:8001"
