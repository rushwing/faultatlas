apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-config
  namespace: faultatlas
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MONGO_DB: "faultatlas"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "faultatlas-ingestion-group"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "64"
