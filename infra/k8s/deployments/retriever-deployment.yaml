apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  namespace: faultatlas
  labels:
    app: retriever
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retriever
  template:
    metadata:
      labels:
        app: retriever
    spec:
      containers:
        - name: retriever
          image: faultatlas/retriever:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: retriever-config
            - secretRef:
                name: faultatlas-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
